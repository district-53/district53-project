{% extends "base.html" %}
{% block title %}The Wall{% endblock %}
{% block body %}
<main class="container my-auto py-5 text-center">
    <div class="card bg-dark border-info border-2 shadow-lg mx-auto col-12 col-md-8 col-lg-6">
        <div class="card-body p-5">
            <p class="display-1 text-info mb-0">❄</p>
            <h1 class="display-4 text-info font-title">The Wall</h1>
            <p class="lead text-light">You have been exiled to the Night's Watch.</p>
            <p class="text-secondary fst-italic">"Night gathers, and now my watch begins."</p>
        </div>
    </div>
</main>
{% endblock %}

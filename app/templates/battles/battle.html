{% extends "base.html" %}
{% block title %}Duel #{{ battle.id }}{% endblock %}

{% block body %}
<main class="container py-5 text-center font-manuscript">
    <div class="card bg-dark text-light border-warning mx-auto" style="max-width: 500px;">
        <div class="card-body">
            <h1 class="h3 text-warning font-title mb-3">
                {{ challenger.username }} vs {{ opponent.username }}
            </h1>
            <p class="mb-1"><strong>Discipline:</strong> {{ battle.discipline | capitalize }}</p>
            <p class="mb-3"><strong>Status:</strong> {{ battle.status }}</p>
            <p class="text-secondary fst-italic">Battle arena coming soon...</p>
            <a href="{{ url_for('notifications.inbox') }}" class="btn btn-outline-warning btn-sm">Back to Inbox</a>
        </div>
    </div>
</main>
{% endblock %}

{% extends "base.html" %}
{% block title %}Log In - Hall of Tourneys{% endblock %}
{% block body %}
<main class="container my-auto py-5">
    <div class="card bg-dark border-warning border-2 shadow-lg mx-auto col-12 col-md-6 col-lg-4">
        <div class="card-body p-4">
            <h2 class="text-warning text-center font-title">Enter the Hall</h2>
            <hr class="border-warning">

            {% with messages = get_flashed_messages() %}
                {% for m in messages %}
                    <div class="alert alert-danger py-2">{{ m }}</div>
                {% endfor %}
            {% endwith %}

            <form method="post" action="{{ url_for('auth.login') }}" class="d-grid gap-3">
                <div class="form-floating">
                    <input type="text" class="form-control" id="username" name="username" placeholder="username" required>
                    <label for="username">Username</label>
                </div>
                <div class="form-floating">
                    <input type="password" class="form-control" id="password" name="password" placeholder="password" required>
                    <label for="password">Password</label>
                </div>
                <button type="submit" class="btn btn-warning btn-lg">Log in</button>
            </form>

            <p class="text-center mt-3 mb-0">
                <a href="{{ url_for('auth.signup') }}" class="link-warning">No account? Sign up</a>
            </p>
        </div>
    </div>
</main>
{% endblock %}

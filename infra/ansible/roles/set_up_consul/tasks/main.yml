- name: Consul config
  template:
    src: consul.hcl.j2
    dest: /etc/consul.d/consul.hcl
    owner: consul
    group: consul
    mode: "0640"
  notify: Restart consul

- name: Firewall on every VM
  community.general.ufw:
    rule: allow
    port: "8301"
    from_ip: 192.168.56.0/24

- name: Firewall on consul VM only
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
    from_ip: 192.168.56.0/24
  loop:
    - "8300"
    - "8500"
  when: "'consul' in group_names"

- name: Start consul
  service:
    name: consul
    state: started
    enabled: true
#create service
- name: Install systemd unit
  ansible.builtin.template:
    src: hall.service.j2
    dest: /etc/systemd/system/hall.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hall

- name: Enable and start hall
  ansible.builtin.systemd:
    name: hall
    enabled: true
    state: started
    daemon_reload: true
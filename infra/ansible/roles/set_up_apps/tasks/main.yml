- name: Validate required secrets
  ansible.builtin.assert:
    that:
      - db_password is defined and db_password | length > 0
      - secret_key is defined and secret_key | length > 0
      - s3_access_key is defined and s3_access_key | length > 0
      - s3_secret_key is defined and s3_secret_key | length > 0
    fail_msg: "One of the required secrets is empty"
    quiet: true
  no_log: true

# ---------- user and folders ----------
- name: Create app user
  ansible.builtin.user:
    name: hall
    group: hall
    home: /var/lib/hall
    shell: /usr/sbin/nologin
    create_home: true

- name: Create env directory
  ansible.builtin.file:
    path: /etc/hall
    state: directory
    owner: root
    group: "hall"
    mode: "0750"

# ---------- code ----------
- name: Copy app code
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../app/"
    dest: /opt/hall/
    owner: root
    group: hall
  notify: Restart hall

# ---------- python ----------
- name: Install python3-venv
  ansible.builtin.apt:
    name: python3-venv
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install requirements into venv
  ansible.builtin.pip:
    requirements: /opt/hall/requirements.txt
    virtualenv: /opt/venv
    virtualenv_command: python3 -m venv
  notify: Restart hall

# ---------- config ----------
- name: App env file (secrets)
  ansible.builtin.template:
    src: app.env.j2
    dest: /etc/hall/app.env
    owner: root
    group: hall
    mode: "0640"
  no_log: true
  notify: Restart hall

- name: Install systemd unit
  ansible.builtin.template:
    src: hall.service.j2
    dest: /etc/systemd/system/hall.service
    owner: root
    group: root
    mode: "0644"
  notify: Restart hall

# ---------- database (only once, from the first app VM) ----------
- name: Create tables, bucket and seed data
  ansible.builtin.shell: |
    /opt/venv/bin/flask --app app init-db
    /opt/venv/bin/flask --app app seed
    touch /var/lib/hall/.db_initialized
  args:
    chdir: /opt/hall
    creates: /var/lib/hall/.db_initialized
  become_user: hall
  run_once: true

# ---------- start ----------
- name: Enable and start hall
  ansible.builtin.systemd:
    name: hall
    enabled: true
    state: started
    daemon_reload: true
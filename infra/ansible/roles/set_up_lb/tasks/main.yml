- name: Install packages
  apt:
    name:
      - nginx
      - curl
      - ufw
    state: present
    update_cache: true

- name: Generate nginx lb config
  template:
    src: lb_template.j2
    dest: /etc/nginx/conf.d/lb.conf
    mode: "644"
  notify: Restart nginx


- name: Remove default nginx site
  file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Restart nginx


- name: Enable and start nginx
  service:
    name: nginx
    state: started
    enabled: true

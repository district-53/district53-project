- name: Common setup and Consul agent on every VM
  hosts: all
  become: true
  roles:
    - common
    - set_up_consul

- name: Set up db
  hosts: db
  become: true
  roles:  
   - set_up_db


- name: Set up apps
  hosts: apps
  become: true
  roles:  
   - set_up_apps


- name: Set up lb
  hosts: lb
  become: true
  roles:  
   - set_up_lb
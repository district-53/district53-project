- name: Configure Jenkins
  hosts: jenkins
  become: true

  vars:
    plugin_manager_version: "2.16.0"
    plugin_manager_jar: /opt/jenkins-plugin-manager.jar

  tasks:
    - name: Check that the secrets are set
      ansible.builtin.assert:
        that:
          - jenkins_admin_password | length > 0
          - ansible_ssh_key | length > 0
          - vault_password | length > 0
        fail_msg: "Create jenkins_admin_password, ansible_key and vault_password in infra/secrets/ first"
      no_log: true

    - name: Install Java, git and Ansible
      ansible.builtin.apt:
        name:
          - acl
          - fontconfig
          - openjdk-21-jre-headless
          - git
          - ansible
        state: present
        update_cache: true

    - name: Folder for apt keys
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download the Jenkins repo key
      ansible.builtin.get_url:
        url: https://pkg.jenkins.io/debian-stable/jenkins.io-2026.key
        dest: /etc/apt/keyrings/jenkins-keyring.asc
        mode: "0644"

    - name: Add the Jenkins repo
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/jenkins-keyring.asc] https://pkg.jenkins.io/debian-stable binary/"
        filename: jenkins
        state: present

    - name: Install Jenkins
      ansible.builtin.apt:
        name: jenkins
        state: present
        update_cache: true

    - name: Folder for the Jenkins systemd override
      ansible.builtin.file:
        path: /etc/systemd/system/jenkins.service.d
        state: directory
        mode: "0755"

    - name: Disable the setup wizard, point to JCasC
      ansible.builtin.copy:
        dest: /etc/systemd/system/jenkins.service.d/override.conf
        content: |
          [Service]
          Environment="JAVA_OPTS=-Djava.awt.headless=true -Djenkins.install.runSetupWizard=false"
          Environment="CASC_JENKINS_CONFIG=/var/lib/jenkins/jenkins.yaml"
        mode: "0644"
      notify: Restart Jenkins

    - name: Download the plugin manager
      ansible.builtin.get_url:
        url: "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/{{ plugin_manager_version }}/jenkins-plugin-manager-{{ plugin_manager_version }}.jar"
        dest: "{{ plugin_manager_jar }}"
        mode: "0644"

    - name: Copy the plugin list
      ansible.builtin.copy:
        src: plugins.txt
        dest: /var/lib/jenkins/plugins.txt
        owner: jenkins
        group: jenkins
        mode: "0644"
      register: plugin_list

    - name: Install plugins
      ansible.builtin.command:
        cmd: >
          java -jar {{ plugin_manager_jar }}
          --war /usr/share/java/jenkins.war
          --plugin-download-directory /var/lib/jenkins/plugins
          --plugin-file /var/lib/jenkins/plugins.txt
      become_user: jenkins
      when: plugin_list is changed
      notify: Restart Jenkins

    - name: Folder for secrets that JCasC reads
      ansible.builtin.file:
        path: /var/lib/jenkins/casc_secrets
        state: directory
        owner: jenkins
        group: jenkins
        mode: "0700"

    - name: Write secret files
      ansible.builtin.copy:
        dest: "/var/lib/jenkins/casc_secrets/{{ item.name }}"
        content: "{{ item.value }}\n"
        owner: jenkins
        group: jenkins
        mode: "0600"
      loop:
        - { name: ansible_key,    value: "{{ ansible_ssh_key }}" }
        - { name: vault_password, value: "{{ vault_password }}" }
      no_log: true
      notify: Restart Jenkins

    - name: Create JCasC config
      ansible.builtin.template:
        src: jenkins.yaml.j2
        dest: /var/lib/jenkins/jenkins.yaml
        owner: jenkins
        group: jenkins
        mode: "0600"
      no_log: true
      notify: Restart Jenkins

    - name: Enable and start Jenkins
      ansible.builtin.systemd:
        name: jenkins
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: Restart Jenkins
      ansible.builtin.systemd:
        name: jenkins
        state: restarted
        daemon_reload: true

  post_tasks:
    - name: Wait for Jenkins UI
      ansible.builtin.wait_for:
        host: localhost
        port: 8080
        timeout: 150
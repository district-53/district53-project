name: Lint

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

permissions: {}

jobs:
  build:
    name: Lint
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read
      issues: write
      pull-requests: write
      statuses: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Super-linter
        uses: super-linter/super-linter@v9.0.0
        env:
          DEFAULT_BRANCH: main
          VALIDATE_ALL_CODEBASE: false

          VALIDATE_GITLEAKS: true
          VALIDATE_YAML: true
          VALIDATE_BASH: true
          VALIDATE_ANSIBLE: true
          ANSIBLE_DIRECTORY: ansible
          VALIDATE_GROOVY: true
          VALIDATE_GITHUB_ACTIONS: true
          VALIDATE_PYTHON_RUFF: true

          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}